<svg height="400" preserveAspectRatio="none" viewBox="0 0 400 400" width="400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <text fill="#222222" font-family="Arial" font-size="13.4" font-style="normal" font-weight="600" x="20" y="20">
    <tspan dy="1em" x="20">One line</tspan>
  </text>
  <text fill="#222222" font-family="Arial" font-size="13.4" font-style="normal" font-weight="600" x="20" y="100">
    <tspan dy="1em" x="20">Line 1</tspan>
    <tspan dy="1em" x="20">Line 2</tspan>
    <tspan dy="1em" x="20">Line 3</tspan>
  </text>
  <text fill="#222222" font-family="Arial" font-size="13.4" font-style="normal" font-weight="600" x="20" y="180">
    <tspan dy="1em" x="20">Before empty</tspan>
    <tspan dy="1em" x="20"> </tspan>
    <tspan dy="1em" x="20">After empty</tspan>
  </text>
  <text fill="#222222" font-family="Arial" font-size="13.4" font-style="normal" font-weight="600" x="20" y="260">
    <tspan dy="1em" x="20">Trailing newline</tspan>
    <tspan dy="1em" x="20"> </tspan>
  </text>
  <text fill="#222222" font-family="Arial" font-size="13.4" font-style="normal" font-weight="600" x="20" y="340">
    <tspan dy="1em" x="20">CRLF 1</tspan>
    <tspan dy="1em" x="20">CRLF 2</tspan>
  </text>
</svg>
